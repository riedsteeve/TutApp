<div class="relative min-h-screen sm:p-10">

  <button
    routerLink="/"
    class="absolute top-10 left-10 flex cursor-pointer items-center gap-2 rounded-lg bg-violet-600 px-4 py-2 text-white transition-colors hover:bg-violet-500"
  >
    <span class="material-symbols-outlined">arrow_back</span>
    Retour
  </button>

  <div class="flex min-h-[calc(100vh-5rem)] items-center justify-center">
    <div class="w-full sm:w-4/6 lg:w-2/5">
      <div
        class="w-full rounded-2xl border-2 border-violet-500 bg-violet-900 px-6 py-4 shadow-2xl inset-shadow-sm inset-shadow-black-500/50"
      >
        <form [formGroup]="createAccountForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-3">
          <div class="flex flex-col gap-1">
            <label for="nom" class="text-white">Nom</label>
            <input
              id="nom"
              type="text"
              formControlName="nom"
              placeholder="Votre nom"
              class="rounded-lg border border-violet-400 bg-violet-800 px-4 py-2 text-white outline-none placeholder:text-violet-300 focus:border-violet-300"
              >
          </div>

          <div class="flex flex-col gap-1">
            <label for="prenom" class="text-white">Prénom</label>
            <input
              id="prenom"
              type="text"
              formControlName="prenom"
              placeholder="Votre prénom"
              class="rounded-lg border border-violet-400 bg-violet-800 px-4 py-2 text-white outline-none placeholder:text-violet-300 focus:border-violet-300"
              >
          </div>

          <div class="flex flex-col gap-1">
            <label for="email" class="text-white">Email</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="example@gmail.com"
              class="rounded-lg border border-violet-400 bg-violet-800 px-4 py-2 text-white outline-none placeholder:text-violet-300 focus:border-violet-300"
              >
          </div>

          <div class="flex flex-col gap-1">
            <label for="motDePasse" class="text-white">Mot de passe</label>
            <input
              id="motDePasse"
              type="password"
              formControlName="mdp"
              placeholder="Votre mot de passe"
              class="rounded-lg border border-violet-400 bg-violet-800 px-4 py-2 text-white outline-none placeholder:text-violet-300 focus:border-violet-300"
              >
          </div>

          <div class="flex flex-col gap-1">
            <label for="confmdp" class="text-white">Confirmer le mot de passe</label>
            <input
              id="confmdp"
              type="password"
              formControlName="confirmMdp"
              placeholder="Confirmez votre mot de passe"
              class="rounded-lg border border-violet-400 bg-violet-800 px-4 py-2 text-white outline-none placeholder:text-violet-300 focus:border-violet-300"
              >
          </div>

          <div class="flex flex-col gap-1">
            <label for="username" class="text-white">Username</label>
            <input
              id="username"
              type="text"
              formControlName="username"
              placeholder="Votre username"
              class="rounded-lg border border-violet-400 bg-violet-800 px-4 py-2 text-white outline-none placeholder:text-violet-300 focus:border-violet-300"
              >
          </div>

          <button type="submit" [disabled]="createAccountForm.invalid || isLoading()"
          class="mt-2 rounded-lg bg-violet-500 px-4 py-2 font-semibold text-white transition hover:bg-violet-400 disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer"
          >
            {{ isLoading() ? 'Création de compte en cours...' : 'Créer mon compte' }}
          </button>
      </form>
    </div>
  </div>
  </div>

</div>
